[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scilens"
version = "0.1.0"
description = "AI-powered scientific literature analysis: retrieve, rank, classify, and aggregate evidence from PubMed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LakshikaK" }]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "numpy>=1.26.0",
  "openai>=1.40.0",
  "pandas>=2.2.0",
  "plotly>=5.22.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "scikit-learn>=1.4.0",
  "sentence-transformers>=3.0.0",
  "streamlit>=1.36.0",
  "torch>=2.2.0",
  "transformers>=4.41.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
scilens = "scilens.__main__:main"

[tool.setuptools.packages.find]
include = ["scilens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
